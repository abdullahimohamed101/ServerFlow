name: Nightly

# Slow or noisy checks that should not block a pull request but should never go unnoticed:
# the race detector under CPU pressure (flaky tests show up here first), the gateway overhead
# budget, and known vulnerabilities. A failure emails the person who last changed the schedule.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  stress:
    name: race tests under CPU load
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SERVERFLOW_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PostgreSQL 16 with password authentication, started here instead of as a `services:` container because the
      # runner pulls a service image without retries and an anonymous pull from a shared runner is rate limited
      # ("toomanyrequests: Rate exceeded"). The image is cached as a tarball and pulled with retries on a miss.
      - name: Digest of the PostgreSQL image (cache key)
        id: pgimg
        run: echo "digest=$(scripts/ci-docker-pull.sh digest public.ecr.aws/docker/library/postgres:16)" >> "$GITHUB_OUTPUT"
      - name: Cache the PostgreSQL image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/images/postgres.tar
          key: image-public.ecr.aws/docker/library/postgres:16-${{ steps.pgimg.outputs.digest }}
      - name: Start PostgreSQL
        # Optional authenticated pull: scripts/ci-docker-pull.sh runs `docker login` only when BOTH values are non-empty. They are
        # empty (anonymous pulls, as before) unless the repository owner creates the secrets DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN;
        # none exists, and a pull request from a fork never receives them.
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          scripts/ci-docker-pull.sh public.ecr.aws/docker/library/postgres:16 "$RUNNER_TEMP/images/postgres.tar"
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres public.ecr.aws/docker/library/postgres:16
          for i in $(seq 1 60); do
            docker exec postgres pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "PostgreSQL did not start"; docker logs --tail 50 postgres; exit 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Start CPU load
        run: |
          for _ in 1 2 3 4; do
            (yes > /dev/null &)
          done
      - name: Race tests, three times, under load
        run: go test -race -count=3 ./...

  overhead:
    name: gateway overhead budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Overhead test (p95 budget)
        run: go test -count=1 -v -run TestGatewayOverhead ./internal/gateway

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: govulncheck
        run: scripts/quality.sh vuln

  compose-smoke-scaled:
    # Phase 16 (ADR-021): the container stack with three gateway replicas behind the load balancer, so check S13
    # (requests reach several replicas, the rate-limit quota is shared) runs too. Same registries and retries as
    # the pull request job.
    name: compose smoke with GATEWAYS=3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull every image (retries with backoff)
        run: scripts/dev-pull.sh
      - name: Start the stack with three gateways
        run: |
          cp deploy/compose/.env.example .env
          sed -i 's/^GATEWAYS=.*/GATEWAYS=3/' .env
          make dev-up
      - name: Smoke checks (all 13 must run)
        run: |
          set -o pipefail
          make dev-smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          tail -1 "$RUNNER_TEMP/smoke.log" | grep -Eq 'smoke: 13 of 13 checks passed, 0 failed, 0 skipped$'
      - name: Container audit
        run: make dev-audit
      - name: Stop the stack
        if: always()
        run: make dev-down

  trivy-report:
    # Report only (never gates): HIGH and CRITICAL findings with a fix available in the six ServerFlow images.
    # The scanner image is pinned by digest and comes from public.ecr.aws; its vulnerability database is a separate
    # anonymous download that is known to be rate limited, so a failure to fetch it fails this advisory job only.
    name: image vulnerability report (Trivy, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      TRIVY_IMAGE: public.ecr.aws/aquasecurity/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the six images
        run: |
          scripts/dev-pull.sh
          for t in gateway control-plane worker-agent mock-worker usage-consumer admin; do
            docker build -q -f deploy/docker/Dockerfile --target "$t" -t "serverflow/$t:scan" .
          done
      - name: Scan from docker save tarballs (the scanner gets no Docker socket)
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          for t in gateway control-plane worker-agent mock-worker usage-consumer admin; do
            echo "== $t"
            docker save "serverflow/$t:scan" -o "$RUNNER_TEMP/scan/$t.tar"
            docker run --rm -v "$RUNNER_TEMP/scan:/scan:ro" "$TRIVY_IMAGE" image --input "/scan/$t.tar" --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0
          done
