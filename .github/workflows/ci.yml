name: CI

# Every job runs scripts/quality.sh, so what CI checks is exactly what `make quality` runs locally.
# Actions are pinned to commit SHAs (the comment names the release); Dependabot keeps them current.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run in progress; pushes to master always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (gofmt, vet, golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Same version as the developers run (golangci-lint 2.14.0); the script runs it.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
      - name: Lint
        run: scripts/quality.sh lint

  test:
    # The module's minimum Go (go.mod) and the current stable Go: the first catches use of newer
    # APIs than we promise, the second catches the next release breaking us.
    name: unit and race tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The promtool-backed tests skip here instead of pulling a container image; the observability job below
      # installs the pinned promtool and requires it.
      PROMTOOL_DISABLE_DOCKER: "1"
    strategy:
      fail-fast: false
      matrix:
        go: [minimum, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.go == 'minimum'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.go == 'stable'
        with:
          go-version: stable
          cache: true
      - name: Unit tests
        run: scripts/quality.sh unit
      - name: Race tests
        run: scripts/quality.sh race
      - name: Tracing tests must run (no Docker)
        run: scripts/quality.sh tracing

  integration:
    name: integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A real PostgreSQL with password authentication. The tests create and drop their own databases.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16  # ECR mirror: Docker Hub rate-limits shared runners
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SERVERFLOW_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      SERVERFLOW_TEST_REDIS_ADDR: 127.0.0.1:6379
      SERVERFLOW_TEST_REDIS_PASSWORD: ci-redis-test-password
      SERVERFLOW_TEST_KAFKA_BROKERS: 127.0.0.1:59092
      SERVERFLOW_TEST_KAFKA_USER: serverflow-test
      SERVERFLOW_TEST_KAFKA_PASSWORD: serverflow-test-kafka-password
      SERVERFLOW_TEST_KAFKA_PRIVATE_PORT_BASE: "59100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A real Redis 7 with a password like scripts/dev-redis.sh (a service container cannot take command
      # arguments, so it is started here). This job's name stays "integration (PostgreSQL)" so a required-check
      # setting keeps matching.
      - name: Start Redis
        run: |
          docker run -d --name redis -p 127.0.0.1:6379:6379 public.ecr.aws/docker/library/redis:7 redis-server --requirepass "$SERVERFLOW_TEST_REDIS_PASSWORD" --save "" --appendonly no
          for i in $(seq 1 30); do
            docker exec redis redis-cli -a "$SERVERFLOW_TEST_REDIS_PASSWORD" --no-auth-warning ping 2>/dev/null | grep -q PONG && exit 0
            sleep 1
          done
          echo "Redis did not start"; exit 1
      # A Kafka-compatible broker with SASL/SCRAM, started by the same script developers use. The image is Redpanda
      # (Kafka API compatible, not Apache Kafka, ADR-019). Its registry host docker.redpanda.com is only a front for
      # Docker Hub (anonymous pulls count against Docker Hub's shared-runner limit) and no unauthenticated mirror exists
      # on public.ecr.aws, quay.io or ghcr.io, so: the image is cached as a `docker save` tarball keyed by its
      # reference, a cache miss pulls with retries and backoff (scripts/dev-kafka.sh pull), and a hit pulls nothing.
      # What is NOT verified: a cold pull from a GitHub-hosted runner has never been run from here. If it is rate
      # limited past the retries, the step fails loudly; an optional `docker login` with a Docker Hub account in a
      # repository secret before this step lifts the limit (docs/development/ci.md).
      - name: Redpanda image reference
        id: redpanda
        run: echo "image=$(scripts/dev-kafka.sh image)" >> "$GITHUB_OUTPUT"
      - name: Cache the Redpanda image
        id: redpanda-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/redpanda-image.tar
          key: redpanda-image-${{ steps.redpanda.outputs.image }}
      - name: Load the cached Redpanda image
        if: steps.redpanda-cache.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/redpanda-image.tar"
      - name: Pull the Redpanda image (cache miss only; retries with backoff)
        if: steps.redpanda-cache.outputs.cache-hit != 'true'
        run: |
          scripts/dev-kafka.sh pull
          docker save "${{ steps.redpanda.outputs.image }}" -o "$RUNNER_TEMP/redpanda-image.tar"
      - name: Start Kafka
        run: scripts/dev-kafka.sh start
      - name: Keep the Kafka log on failure
        if: failure()
        run: docker logs --tail 200 serverflow-test-kafka-59092 || true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Keep test logs in the runner's temp directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Database, Redis and Kafka tests must run, not skip
        run: scripts/quality.sh integration
      - name: Keep the test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-log
          path: ${{ runner.temp }}/serverflow-*
          if-no-files-found: ignore

  build:
    name: build (cross-compile, go.mod tidy and verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: scripts/quality.sh build

  vulncheck:
    # Known vulnerabilities in dependencies and the standard library. A new advisory can appear
    # between two pushes and has nothing to do with the change under review, so on pull requests this
    # job reports without blocking; the nightly run (nightly.yml) fails loudly.
    name: govulncheck (advisory on pull requests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: govulncheck
        run: scripts/quality.sh vuln

  observability:
    # Prometheus config, recording and alert rules with their promtool tests, and the Grafana dashboards checked
    # against the metrics a running cluster exports (Phase 10, ADR-017). promtool is the pinned official release
    # from GitHub, verified against its published SHA-256 (Docker Hub is not used: it rate-limits shared runners).
    name: observability (promtool, dashboards)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROMTOOL_VERSION: 2.53.0
      PROMTOOL_SHA256: d9900a11e3c89261e6416e3c9989858bad7b206af8b6838dfe9a5392d8ddc60d # prometheus-2.53.0.linux-amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install promtool
        run: |
          archive="prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/$archive"
          echo "${PROMTOOL_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1 "prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool"
          mkdir -p "$HOME/.local/bin" && mv "$RUNNER_TEMP/promtool" "$HOME/.local/bin/promtool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: promtool, dashboards and exported metrics
        run: scripts/quality.sh observability

  deploy:
    # Phase 16 (ADR-021): the container deployment's static checks. No images are pulled and no daemon is needed:
    # the tests/deploy tests (which must run), hadolint on the Dockerfile, shellcheck on the scripts and
    # `docker compose config` of every file and profile combination. hadolint is the pinned official release,
    # verified against its published SHA-256 (the ghcr.io image is not used).
    name: deploy (lint, config, static tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HADOLINT_VERSION: v2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507 # hadolint-linux-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install hadolint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/hadolint"
          mkdir -p "$HOME/.local/bin" && mv "$RUNNER_TEMP/hadolint" "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tool versions (shellcheck and docker compose come with the runner image)
        run: |
          hadolint --version
          shellcheck --version | sed -n 2p
          docker compose version
      - name: Deployment static checks
        run: scripts/quality.sh deploy

  compose-smoke:
    # Phase 16 (ADR-021): the whole system in containers, then 13 end-to-end checks that must all run (0 skipped).
    # Advisory at first: it is not in the owner's required-check list (docs/development/ci.md). Images come from
    # public.ecr.aws, quay.io, mirror.gcr.io and gcr.io, never Docker Hub; pulls retry with backoff
    # (scripts/dev-pull.sh) and the Redpanda image is cached as a tarball like the integration job's.
    name: compose smoke (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Redpanda image reference
        id: redpanda
        run: echo "image=$(docker compose --profile events config --no-env-resolution --images | grep redpanda | head -1)" >> "$GITHUB_OUTPUT"
      - name: Cache the Redpanda image
        id: redpanda-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/redpanda-image.tar
          key: redpanda-image-${{ steps.redpanda.outputs.image }}
      - name: Load the cached Redpanda image
        if: steps.redpanda-cache.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/redpanda-image.tar"
      - name: Pull every image (retries with backoff)
        run: scripts/dev-pull.sh --skip-present
      - name: Save the Redpanda image for the cache
        if: steps.redpanda-cache.outputs.cache-hit != 'true'
        run: docker save "${{ steps.redpanda.outputs.image }}" -o "$RUNNER_TEMP/redpanda-image.tar"
      - name: Start the stack (three gateways, so check S13 runs too and nothing is skipped)
        run: |
          cp deploy/compose/.env.example .env
          sed -i 's/^GATEWAYS=.*/GATEWAYS=3/' .env
          make dev-up
      - name: Smoke checks
        run: |
          set -o pipefail
          make dev-smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          tail -1 "$RUNNER_TEMP/smoke.log" | grep -Eq 'smoke: [0-9]+ of [0-9]+ checks passed, 0 failed, 0 skipped$'
      - name: Stack status and logs on failure (secret-free by check S12)
        if: failure()
        run: |
          make dev-ps || true
          docker compose -p serverflow-dev logs --no-color > "$RUNNER_TEMP/compose-logs.txt" 2>&1 || true
          # Belt and braces for the artifact: withhold the log if any generated secret value appears in it (nothing is printed).
          { for f in .dev/*.env; do case "$f" in .dev/compose.env) ;; *) sed -n 's/^[A-Z_]*=//p' "$f" ;; esac; done; cat .dev/api_key* 2>/dev/null; } | grep -E '.{12,}' > "$RUNNER_TEMP/needles" || true
          if grep -qF -f "$RUNNER_TEMP/needles" "$RUNNER_TEMP/compose-logs.txt"; then
            echo "a generated secret appeared in the logs; the artifact is withheld"
            rm -f "$RUNNER_TEMP/compose-logs.txt"
          fi
          rm -f "$RUNNER_TEMP/needles"
      - name: Keep the logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-smoke-logs
          path: |
            ${{ runner.temp }}/compose-logs.txt
            ${{ runner.temp }}/smoke.log
          if-no-files-found: ignore
      - name: Stop the stack and check nothing is left behind
        if: always()
        run: make dev-down
