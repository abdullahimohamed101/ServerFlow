name: CI

# Every job runs scripts/quality.sh, so what CI checks is exactly what `make quality` runs locally.
# Actions are pinned to commit SHAs (the comment names the release); Dependabot keeps them current.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run in progress; pushes to master always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (gofmt, vet, golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Same version as the developers run (golangci-lint 2.14.0); the script runs it.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
      - name: Lint
        run: scripts/quality.sh lint

  test:
    # The module's minimum Go (go.mod) and the current stable Go: the first catches use of newer
    # APIs than we promise, the second catches the next release breaking us.
    name: unit and race tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The promtool-backed tests skip here instead of pulling a container image; the observability job below
      # installs the pinned promtool and requires it.
      PROMTOOL_DISABLE_DOCKER: "1"
    strategy:
      fail-fast: false
      matrix:
        go: [minimum, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.go == 'minimum'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.go == 'stable'
        with:
          go-version: stable
          cache: true
      - name: Unit tests
        run: scripts/quality.sh unit
      - name: Race tests
        run: scripts/quality.sh race

  integration:
    name: integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A real PostgreSQL with password authentication. The tests create and drop their own databases.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16  # ECR mirror: Docker Hub rate-limits shared runners
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SERVERFLOW_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      SERVERFLOW_TEST_REDIS_ADDR: 127.0.0.1:6379
      SERVERFLOW_TEST_REDIS_PASSWORD: ci-redis-test-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A real Redis 7 with a password like scripts/dev-redis.sh (a service container cannot take command
      # arguments, so it is started here). This job's name stays "integration (PostgreSQL)" so a required-check
      # setting keeps matching.
      - name: Start Redis
        run: |
          docker run -d --name redis -p 127.0.0.1:6379:6379 public.ecr.aws/docker/library/redis:7 redis-server --requirepass "$SERVERFLOW_TEST_REDIS_PASSWORD" --save "" --appendonly no
          for i in $(seq 1 30); do
            docker exec redis redis-cli -a "$SERVERFLOW_TEST_REDIS_PASSWORD" --no-auth-warning ping 2>/dev/null | grep -q PONG && exit 0
            sleep 1
          done
          echo "Redis did not start"; exit 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Keep test logs in the runner's temp directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Database and Redis tests must run, not skip
        run: scripts/quality.sh integration
      - name: Keep the test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-log
          path: ${{ runner.temp }}/serverflow-*
          if-no-files-found: ignore

  build:
    name: build (cross-compile, go.mod tidy and verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: scripts/quality.sh build

  vulncheck:
    # Known vulnerabilities in dependencies and the standard library. A new advisory can appear
    # between two pushes and has nothing to do with the change under review, so on pull requests this
    # job reports without blocking; the nightly run (nightly.yml) fails loudly.
    name: govulncheck (advisory on pull requests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: govulncheck
        run: scripts/quality.sh vuln

  observability:
    # Prometheus config, recording and alert rules with their promtool tests, and the Grafana dashboards checked
    # against the metrics a running cluster exports (Phase 10, ADR-017). promtool is the pinned official release
    # from GitHub, verified against its published SHA-256 (Docker Hub is not used: it rate-limits shared runners).
    name: observability (promtool, dashboards)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROMTOOL_VERSION: 2.53.0
      PROMTOOL_SHA256: d9900a11e3c89261e6416e3c9989858bad7b206af8b6838dfe9a5392d8ddc60d # prometheus-2.53.0.linux-amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install promtool
        run: |
          archive="prometheus-${PROMTOOL_VERSION}.linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/$archive"
          echo "${PROMTOOL_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1 "prometheus-${PROMTOOL_VERSION}.linux-amd64/promtool"
          mkdir -p "$HOME/.local/bin" && mv "$RUNNER_TEMP/promtool" "$HOME/.local/bin/promtool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: promtool, dashboards and exported metrics
        run: scripts/quality.sh observability
