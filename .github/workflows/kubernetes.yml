name: Kubernetes

# Phase 17: the kind cluster. Advisory (not in the owner's required-check list, docs/development/ci.md, D24): it creates a real
# single-node kind cluster on the runner, builds the six ServerFlow images and loads them, deploys the whole system (data
# tier, control plane, gateways, workers with agents, usage consumer, Prometheus, Grafana, Jaeger) under Pod Security `restricted`, bootstraps tenants and
# keys, runs the smoke checks K1-K14 and D2-D7 and the audit. It has not run on GitHub before the pull request
# that adds it; until a run is green its result is unknown (docs/operations/kubernetes-deployment.md, "What is verified").
# The static checks are the k8s-static job in ci.yml, which runs on every pull request.
# Actions are pinned to commit SHAs (the comment names the release); Dependabot keeps them current.

on:
  pull_request:
    paths:
      - "deploy/kubernetes/**"
      - "deploy/docker/**"
      - "cmd/**"
      - "internal/config/**"
      - "internal/gateway/resilience*.go"
      - "internal/worker/**"
      - "observability/**"
      - "scripts/k8s-up.sh"
      - "scripts/k8s-tool.sh"
      - "scripts/dev-up.sh"
      - "scripts/dev-pull.sh"
      - "scripts/ci-docker-pull.sh"
      - "migrations/**"
      - "cmd/admin/**"
      - "docker-compose.yml"
      - ".github/workflows/kubernetes.yml"
  push:
    branches: [master, main]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k8s-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kind-smoke:
    name: k8s kind smoke (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned tool versions (deploy/kubernetes/tools.env is the single source)
        run: grep -E '^(KUBERNETES_VERSION|KUBECTL_LINUX_AMD64_SHA256|KIND_VERSION|KIND_LINUX_AMD64_SHA256)=' deploy/kubernetes/tools.env >> "$GITHUB_ENV"
      - name: Install kubectl and kind (checksum verified)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$RUNNER_TEMP/kubectl" "https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_LINUX_AMD64_SHA256}  $RUNNER_TEMP/kubectl" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/kubectl" && mv "$RUNNER_TEMP/kubectl" "$HOME/.local/bin/kubectl"
          curl -fsSL -o "$RUNNER_TEMP/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_LINUX_AMD64_SHA256}  $RUNNER_TEMP/kind" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/kind" && mv "$RUNNER_TEMP/kind" "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tool versions and the runner's memory and disk
        run: |
          kubectl version --client
          kind version
          docker info --format 'engine memory: {{.MemTotal}} bytes, {{.NCPU}} CPUs'
          df -h / | tail -1
      - name: Cluster up (secrets, kind, build and load the six images, data tier, jobs, core system, tenants and keys)
        run: |
          start=$(date +%s)
          scripts/k8s-up.sh up
          echo "k8s-up took $(( $(date +%s) - start )) s"
      - name: Smoke checks K1-K14, D2-D7 (all must pass, none skipped)
        run: |
          set -o pipefail
          scripts/k8s-up.sh smoke 2>&1 | tee "$RUNNER_TEMP/k8s-smoke.log"
          tail -1 "$RUNNER_TEMP/k8s-smoke.log" | grep -Eq '^smoke: [0-9]+ of [0-9]+ checks passed, 0 failed, 0 skipped$'
      - name: Audit (security context, resources and token mounts of every container)
        run: |
          set -o pipefail
          scripts/k8s-up.sh audit 2>&1 | tee "$RUNNER_TEMP/k8s-audit.log"
          tail -1 "$RUNNER_TEMP/k8s-audit.log" | grep -Eq '^audit: [0-9]+ pods, [0-9]+ containers, 0 exceptions$'
      - name: Cluster state on failure (secret-free by construction, and checked)
        if: failure()
        run: |
          scripts/k8s-up.sh diagnose > "$RUNNER_TEMP/k8s-diagnose.txt" 2>&1 || true
          # Belt and braces for the artifact: withhold the log if any generated secret value appears in it (nothing is printed).
          { for f in .dev/*.env; do sed -n 's/^[A-Z_]*=//p' "$f"; done; for f in .dev/k8s/api_key*; do [ -f "$f" ] && tr -d '\n' < "$f" && echo; done; } | grep -E '.{12,}' > "$RUNNER_TEMP/needles" || true
          for f in k8s-diagnose.txt k8s-smoke.log k8s-audit.log; do
            if [ -f "$RUNNER_TEMP/$f" ] && grep -qF -f "$RUNNER_TEMP/needles" "$RUNNER_TEMP/$f"; then
              echo "a generated secret appeared in $f; that file is withheld"
              rm -f "$RUNNER_TEMP/$f"
            fi
          done
          rm -f "$RUNNER_TEMP/needles"
      - name: Keep the diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k8s-diagnostics
          path: |
            ${{ runner.temp }}/k8s-diagnose.txt
            ${{ runner.temp }}/k8s-smoke.log
            ${{ runner.temp }}/k8s-audit.log
          if-no-files-found: ignore
      - name: Delete the cluster and check nothing is left behind
        if: always()
        run: scripts/k8s-up.sh down
