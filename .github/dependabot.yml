# Weekly dependency updates. Actions are pinned to commit SHAs, so Dependabot is what keeps them
# from going stale: it bumps the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  # Phase 16: the container images. `docker` reads the FROM lines of the Dockerfile; `docker-compose` reads the image
  # references of the root docker-compose.yml. Whether Dependabot can resolve references on public.ecr.aws, quay.io,
  # gcr.io and mirror.gcr.io (not Docker Hub) is unverified; if it cannot, the digest pins in those files are
  # refreshed by hand (docs/operations/docker-deployment.md).
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # Major versions of the stack's services change on-disk layout, flags and file formats, so each one is a deliberate
    # project, not a weekly bump. The first Dependabot PR (#31) proposed Postgres 16->18 (the 18+ image wants its data
    # mount at /var/lib/postgresql, so the tmpfs at the old path left the container unhealthy and the compose smoke job
    # failed), Redis 7->8, Redpanda v25->v26, Prometheus 2->3, Grafana 11->13 and nginx 1.27->1.31 in one group. Minor
    # and patch updates still arrive; take a major by hand, with the smoke test and a plan note
    # (docs/operations/docker-deployment.md, ADR-021 "Operational notes").
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]
