# Weekly dependency updates. Actions are pinned to commit SHAs, so Dependabot is what keeps them
# from going stale: it bumps the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
    ignore:
      # These releases raise the module's Go floor above what go.mod says. Bumping the floor is a
      # deliberate project decision, not something a dependency bot should do (see ADR-014, ADR-015).
      # Revisit these ignores: the floor is 1.26 now, so they are probably unnecessary.
      - dependency-name: github.com/jackc/pgx/v5
        versions: [">=5.9.0"]
      - dependency-name: github.com/redis/go-redis/v9
        versions: [">=9.23.0"]
      # OpenTelemetry Go is held at v1.46.x (ADR-018). The Go 1.26 floor now allows v1.47+, but the bump is a
      # separate follow-up pull request (with golang.org/x/net >= v0.60.0); that pull request removes this entry.
      # The wildcard covers otel, otel/trace, otel/sdk and the OTLP exporter.
      - dependency-name: "go.opentelemetry.io/otel*"
        versions: [">=1.47.0"]

  # Phase 16: the container images. `docker` reads the FROM lines of the Dockerfile; `docker-compose` reads the image
  # references of the root docker-compose.yml. Whether Dependabot can resolve references on public.ecr.aws, quay.io,
  # gcr.io and mirror.gcr.io (not Docker Hub) is unverified; if it cannot, the digest pins in those files are
  # refreshed by hand (docs/operations/docker-deployment.md).
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
