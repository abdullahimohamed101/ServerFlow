# The local cluster (Phase 17, D2, D15): one node, the pod network pinned, the published ports on 127.0.0.1 only.
# Created by scripts/k8s-up.sh with a dedicated kubeconfig (.dev/k8s/kubeconfig); never apply this to a real cluster.
# The node image is the one in deploy/kubernetes/tools.env (a test keeps the two equal).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: serverflow
networking:
  # Loopback only: the API server is not reachable from the network.
  apiServerAddress: 127.0.0.1
  # gateway.worker_networks is this CIDR (D11).
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
    image: mirror.gcr.io/kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    # Host port -> NodePort of the Services that PR 3 and PR 4 add. The host ports differ from Compose's (18080, 19090,
    # 19091, 13000, 16686) so both stacks can run at once. Nothing listens on a NodePort until its Service exists.
    extraPortMappings:
      - {listenAddress: 127.0.0.1, protocol: TCP, hostPort: 28080, containerPort: 30080} # gateway
      - {listenAddress: 127.0.0.1, protocol: TCP, hostPort: 29090, containerPort: 30090} # control plane
      - {listenAddress: 127.0.0.1, protocol: TCP, hostPort: 29091, containerPort: 30091} # Prometheus
      - {listenAddress: 127.0.0.1, protocol: TCP, hostPort: 23000, containerPort: 30300} # Grafana
      - {listenAddress: 127.0.0.1, protocol: TCP, hostPort: 26686, containerPort: 30686} # Jaeger
