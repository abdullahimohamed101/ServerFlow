# Jaeger (PR 4): one all-in-one replica with in-memory storage (traces are gone with the pod, as in Compose). The gateway and the
# mock workers send OTLP/HTTP to the Service `jaeger` on 4318; only the UI and query port (16686, Service jaeger-ui) is published,
# NodePort 30686 (overlay) -> host 127.0.0.1:26686. The image is the one docker-compose.yml pins.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: observability
    app.kubernetes.io/component: jaeger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: jaeger
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: observability
    app.kubernetes.io/component: jaeger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: jaeger
  ports:
    - {name: ui, port: 16686, targetPort: ui}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: observability
    app.kubernetes.io/component: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: serverflow
      app.kubernetes.io/component: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serverflow
        app.kubernetes.io/part-of: serverflow
        app.kubernetes.io/component: jaeger
    spec:
      serviceAccountName: jaeger
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: jaeger
          image: quay.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
          imagePullPolicy: IfNotPresent
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: ui, containerPort: 16686}
          env:
            - {name: GOMEMLIMIT, value: 200MiB}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /, port: ui}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: ui}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /, port: ui}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
