# The gateway (D11, D12, D13, D19). Rolling updates replace pods one at a time without ever removing a ready one
# (maxUnavailable 0, maxSurge 1); a replaced pod drains through the gateway's own SIGTERM handling (resilience.mode on): /readyz
# turns 503 and responses carry `Connection: close` at once, the listener stays open for readiness_grace (5 s), in-flight
# requests finish within shutdown_timeout (30 s) of the signal, and terminationGracePeriodSeconds (45 s) is longer than that.
# There is no preStop hook on purpose (D19): the gateway already implements the wait and tests it. The numbers live in the
# ConfigMap generated in kustomization.yaml; tests/k8s asserts the relations between them and this file.
# Readiness is /readyz (drain-aware, and 503 while the registry has no worker); liveness is /healthz and never depends on a
# worker, so a worker outage cannot restart gateways (D13).
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: core
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: gateway
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: core
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: serverflow
      app.kubernetes.io/component: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: core
spec:
  # Two in the base (one replica cannot roll without an outage); the kind overlay sets three.
  replicas: 2
  minReadySeconds: 5
  # A new gateway is not Ready until a worker is registered, so the deadline must outlast a cold start of the whole system.
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: serverflow
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serverflow
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: serverflow
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      # shutdown_timeout (30 s) + margin; no preStop hook (D19).
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      # Preferred only: the kind cluster has one node, so spreading cannot be verified here (docs: "What is not verified").
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: serverflow
                    app.kubernetes.io/component: gateway
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: serverflow
              app.kubernetes.io/component: gateway
      containers:
        - name: gateway
          image: serverflow/gateway
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9100}
          envFrom:
            - configMapRef: {name: gateway-config}
            - secretRef: {name: dsn}
            - secretRef: {name: redis}
            - secretRef: {name: kafka}
            - secretRef: {name: controlplane}
            - secretRef: {name: metrics}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 128Mi}
