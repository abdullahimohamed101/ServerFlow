# The usage consumer (Redpanda -> PostgreSQL), one replica. Its health endpoint listens on 127.0.0.1:9103 only (the binary
# enforces loopback), so the probes are exec probes running the image's `healthcheck` binary (D13); nothing is exposed on the
# pod network. The Secrets `dsn` and `kafka` carry the database DSN and the SASL password.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-consumer
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: usage-consumer
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: core
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: serverflow
      app.kubernetes.io/component: usage-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serverflow
        app.kubernetes.io/component: usage-consumer
        app.kubernetes.io/part-of: serverflow
    spec:
      serviceAccountName: usage-consumer
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: usage-consumer
          image: serverflow/usage-consumer
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: dsn}
            - secretRef: {name: kafka}
          env:
            - {name: SERVERFLOW_POSTGRES_ALLOW_INSECURE_TRANSPORT, value: "true"}
            - {name: SERVERFLOW_EVENTS_BROKERS, value: "redpanda:9092"}
            - {name: SERVERFLOW_EVENTS_SASL_MECHANISM, value: scram-sha-256}
            - {name: SERVERFLOW_EVENTS_SASL_USERNAME, value: serverflow}
            - {name: GOMEMLIMIT, value: 48MiB}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec:
              command: [/usr/local/bin/healthcheck, "http://127.0.0.1:9103/healthz"]
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [/usr/local/bin/healthcheck, "http://127.0.0.1:9103/healthz"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [/usr/local/bin/healthcheck, "http://127.0.0.1:9103/healthz"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
