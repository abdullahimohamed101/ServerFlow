# Grafana (PR 4): one replica. The datasource and the dashboard provider are the files of observability/grafana/provisioning and
# the dashboards are observability/grafana/dashboards, all through generated ConfigMaps (grafana-datasources, grafana-dashboard-provider,
# grafana-dashboards), so they cannot drift from the other stacks. The admin password comes from the Secret `grafana`
# (GF_SECURITY_ADMIN_PASSWORD); anonymous access and sign-up are off. NodePort 30300 (overlay) -> host 127.0.0.1:23000.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: observability
    app.kubernetes.io/component: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: grafana
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: observability
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: serverflow
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serverflow
        app.kubernetes.io/part-of: serverflow
        app.kubernetes.io/component: grafana
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 0
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: mirror.gcr.io/grafana/grafana:11.6.16@sha256:d67af92050b8d93b393dc741864752a69c9da1ffa39c1bb9af49ad5d9e47d2c3
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000}
          envFrom:
            - secretRef: {name: grafana}
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_PATHS_LOGS, value: /tmp/grafana-logs}
            - {name: GF_LOG_MODE, value: console}
            - {name: PROMETHEUS_URL, value: "http://prometheus:9090"}
            - {name: GOMEMLIMIT, value: 200MiB}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 45
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboard-provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - name: data
          emptyDir: {sizeLimit: 64Mi}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
