# PostgreSQL 16, one instance, for development (D10). No HA claim: a node loss loses the volume. The image and its
# digest are the ones in docker-compose.yml (tests/k8s fails if they differ). The password reaches the server through the
# Secret `postgres` (generated by scripts/dev-up.sh secrets, created by scripts/k8s-up.sh), never through this file.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: data
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: data
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: serverflow
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serverflow
        app.kubernetes.io/component: postgres
        app.kubernetes.io/part-of: serverflow
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      # Postgres' "fast" shutdown on SIGTERM checkpoints and exits; 30 s is the Kubernetes default, stated so a test can see it.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: mirror.gcr.io/library/postgres:16-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
          imagePullPolicy: IfNotPresent
          ports:
            - {name: postgres, containerPort: 5432}
          envFrom:
            - secretRef: {name: postgres}
          env:
            - {name: POSTGRES_USER, value: serverflow}
            - {name: POSTGRES_DB, value: serverflow}
            # A subdirectory of the volume: initdb refuses a mount point that is not empty.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, serverflow, -d, serverflow]}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, serverflow, -d, serverflow]}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, serverflow, -d, serverflow]}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: run
          emptyDir: {sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
  # kind's default StorageClass (local path on the node): a restarted pod keeps its data, `kind delete cluster` removes it.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: serverflow
          app.kubernetes.io/component: postgres
          app.kubernetes.io/part-of: serverflow
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
