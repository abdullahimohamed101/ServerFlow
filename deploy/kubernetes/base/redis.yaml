# Redis 7, one instance, no persistence (D10): the rate-limit counters are rebuildable and Phase 16 ran it the same way.
# The password reaches redis-server through a file on a memory-backed emptyDir written by the wrapper below (not argv,
# where `ps` would show it), exactly as docker-compose.yml does. The Secret `redis` is created by scripts/k8s-up.sh.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: data
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: data
spec:
  replicas: 1
  serviceName: redis
  selector:
    matchLabels:
      app.kubernetes.io/name: serverflow
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serverflow
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: serverflow
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: mirror.gcr.io/library/redis:7-alpine@sha256:892022f9f18c26c92c30e15194d132f90044af87b94a491a75429bbc3982eab1
          imagePullPolicy: IfNotPresent
          # $SERVERFLOW_REDIS_PASSWORD has no parentheses, so Kubernetes leaves it for the shell to expand.
          command:
            - sh
            - -c
            - "umask 077; printf 'requirepass %s\\n' \"$SERVERFLOW_REDIS_PASSWORD\" > /tmp/redis.conf; exec redis-server /tmp/redis.conf --save '' --appendonly no --maxmemory 48mb --maxmemory-policy noeviction"
          ports:
            - {name: redis, containerPort: 6379}
          envFrom:
            - secretRef: {name: redis}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec:
              command: [sh, -c, 'REDISCLI_AUTH="$SERVERFLOW_REDIS_PASSWORD" redis-cli ping | grep -q PONG']
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -c, 'REDISCLI_AUTH="$SERVERFLOW_REDIS_PASSWORD" redis-cli ping | grep -q PONG']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [sh, -c, 'REDISCLI_AUTH="$SERVERFLOW_REDIS_PASSWORD" redis-cli ping | grep -q PONG']
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 64Mi}
        # Memory-backed: the password file never reaches the node's disk.
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
