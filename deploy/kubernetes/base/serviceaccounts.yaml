# One ServiceAccount per workload, none with a mounted API token (D17). Nothing here is bound to a Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: serverflow
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: serverflow
    serverflow.dev/phase: foundation
automountServiceAccountToken: false
