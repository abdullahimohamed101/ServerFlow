# Front for GATEWAYS>1 (docker-compose.scale.yml). Docker's DNS returns every gateway replica for the service name;
# the variable makes nginx re-resolve it every 2 s instead of once at start, so replicas can come and go.
# Streaming (SSE) needs no buffering and a long read timeout.
server {
    listen 8080;
    resolver 127.0.0.11 valid=2s ipv6=off;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        set $upstream http://gateway:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 8m;
    }
}
