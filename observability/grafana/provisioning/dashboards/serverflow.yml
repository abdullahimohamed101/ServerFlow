# Loads the dashboards committed under observability/grafana/dashboards (mounted read-only at
# /var/lib/grafana/dashboards). Grafana cannot save over them: change the JSON in the repository.
apiVersion: 1
providers:
  - name: serverflow
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
