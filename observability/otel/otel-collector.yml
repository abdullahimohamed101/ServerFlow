# OpenTelemetry collector configuration for InferGrid.

# Phase 0: skeleton. Pipelines are filled in as components emit
# traces/metrics (Phase 10-11).
receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]